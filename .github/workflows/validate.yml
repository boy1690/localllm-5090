name: validate / 驗證

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure / Repo 結構
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository / 取出 repo
        uses: actions/checkout@v6
      - name: Validate data and public safety / 驗證資料與公開安全
        shell: pwsh
        run: ./tools/validate.ps1
